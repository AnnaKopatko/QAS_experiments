Noise:
  prob_1q: 0.05     # single-qubit depolarizing noise
  prob_2q: 0.20     # two-qubit depolarizing noise
  apply_to_measurements: false

SearchSpace:
  # Valid rotation gates to use in the search space
  # Available options: "RY", "RZ", "RX"
  valid_Rs: ["RY", "RZ"]
  
  # Valid CNOT wire pairs for entanglement
  # These define the connectivity pattern between qubits
  valid_CNOTs:
    - [0, 2]
    - [2, 4]
    - [4, 6]
    - [6, 7]
    - [7, 0]
  
  # how many repeats of the valid Rs for the search space
  num_repears: 2
  n_rotations_per_layer: 2
  n_cnots_per_layer: 1